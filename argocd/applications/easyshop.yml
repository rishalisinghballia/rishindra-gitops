apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: easyshop
  namespace: argocd

spec:
  project: applications

  source:
    repoURL: https://github.com/rishindrasingh/rishindra-gitops.git
    targetRevision: main
    path: apps/easyshop

  destination:
    server: https://kubernetes.default.svc
    namespace: easyshop

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true