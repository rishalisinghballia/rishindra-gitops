apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-applications
  namespace: argocd

spec:
  project: infrastructure

  source:
    repoURL: https://github.com/rishindrasingh/rishindra-gitops.git
    targetRevision: main
    path: argocd/applications

    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true