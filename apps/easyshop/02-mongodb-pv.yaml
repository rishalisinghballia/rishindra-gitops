# metadata:
#   name: mongodb-pv
# spec:
#   capacity:
#     storage: 5Gi
#   accessModes:
#     - ReadWriteOnce
#   hostPath:
#     path: /data/mongodb
#   persistentVolumeReclaimPolicy: Retain


apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: mongodb-gp3
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
parameters:
  type: gp3
  fsType: ext4